[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/ellie-davidson-portfolio"
  to = "/"
  status = 301

# The HTML now references the real root-level paths (/style.css, /images/,
# /audio/), but these rewrites keep the old /css/ and /assets/ URLs working
# for anything still linking to them.
[[redirects]]
  from = "/css/style.css"
  to = "/style.css"
  status = 200

[[redirects]]
  from = "/assets/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/assets/audio/*"
  to = "/audio/:splat"
  status = 200
