[build]
  command = "npm run build"
  publish = "_site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Self-hosted fonts and generated images never change without a new
# filename, so let browsers cache them for a year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Belt-and-braces on top of the edge-function gate and robots.txt: tell
# crawlers not to index the password-protected portfolio and contact pages.
[[headers]]
  for = "/portfolio/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/get-in-touch/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/ellie-davidson-portfolio"
  to = "/portfolio/home/"
  status = 301

# The HTML now references the real root-level paths (/style.css, /images/,
# /audio/), but these rewrites keep the old /css/ and /assets/ URLs working
# for anything still linking to them.
[[redirects]]
  from = "/css/style.css"
  to = "/style.css"
  status = 200

[[redirects]]
  from = "/assets/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/assets/audio/*"
  to = "/audio/:splat"
  status = 200
