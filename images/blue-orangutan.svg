<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 300" role="img" aria-label="A blue orangutan face on a bookmark">
  <!-- Bookmark -->
  <path d="M52 6 h116 a16 16 0 0 1 16 16 v272 l-74 -42 -74 42 V22 a16 16 0 0 1 16 -16 z"
        fill="#e8f0f8" stroke="#2f5d8f" stroke-width="4" stroke-linejoin="round"/>
  <!-- Hair tuft -->
  <path d="M106 84 q-2 -18 10 -24 q2 12 -2 24 z" fill="#2f5d8f"/>
  <!-- Cheek pads -->
  <ellipse cx="110" cy="136" rx="64" ry="54" fill="#4a7fb5"/>
  <!-- Inner face -->
  <ellipse cx="110" cy="138" rx="34" ry="46" fill="#a8c6e4"/>
  <!-- Brow -->
  <path d="M88 116 q10 -8 20 -2" fill="none" stroke="#2f5d8f" stroke-width="3" stroke-linecap="round"/>
  <path d="M112 114 q10 -6 20 2" fill="none" stroke="#2f5d8f" stroke-width="3" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="97" cy="126" r="5.5" fill="#17334f"/>
  <circle cx="123" cy="126" r="5.5" fill="#17334f"/>
  <!-- Muzzle -->
  <ellipse cx="110" cy="161" rx="24" ry="17" fill="#dcebf7"/>
  <!-- Nostrils -->
  <ellipse cx="103" cy="157" rx="3" ry="4.5" fill="#17334f"/>
  <ellipse cx="117" cy="157" rx="3" ry="4.5" fill="#17334f"/>
  <!-- Smile -->
  <path d="M98 169 q12 9 24 0" fill="none" stroke="#17334f" stroke-width="2.5" stroke-linecap="round"/>
</svg>
