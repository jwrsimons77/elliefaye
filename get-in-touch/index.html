<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get In Touch — Ellie Faye</title>
<meta name="description" content="Get in touch with Ellie Faye, Manchester-based creative copywriter">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="/">Ellie Faye</a>
    <button class="nav-toggle" aria-label="Toggle navigation">Menu</button>
    <nav class="site-nav">
      <a href="/">Home</a>
      <a href="/portfolio/">Portfolio</a>
      <a href="/get-in-touch/" class="active">Get In Touch</a>
    </nav>
  </div>
</header>
<main>

<section class="hero">
  <div class="wrap">
    <h1>Get in<br>touch</h1>
    <div class="two-col">
      <div></div>
      <div>
        <p>Got a project in mind, a question, or just fancy a chat about words?</p>
        <p>Drop me a line below and I'll get back to you.</p>
      </div>
    </div>
  </div>
</section>

<section class="tight">
  <div class="wrap">

    <div class="form-success" id="form-success">
      <p>Thanks — your message is on its way. I'll be in touch soon.</p>
    </div>

    <form class="contact-form" id="contact-form" name="contact" method="POST"
          data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact">
      <p style="display:none">
        <label>Don't fill this out: <input name="bot-field"></label>
      </p>

      <div class="form-row">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
      </div>

      <div class="field">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject">
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <button class="submit" type="submit">Send message</button>
    </form>

  </div>
</section>

</main>
<footer class="site-footer">
  <div class="wrap" style="display:flex;justify-content:space-between;width:100%;flex-wrap:wrap;gap:12px;">
    <span>&copy; Ellie Faye</span>
    <span>Manchester, UK</span>
  </div>
</footer>
<script src="/js/main.js"></script>
</body>
</html>
